<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocochet — Handmade Crochet Catalogue</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
       <img src="images/logo.png" alt="" class="brand-logo">
      </span>
      <div class="brand-text">
        <span class="brand-name">Cocochet</span>
        <span class="brand-tag">crafted with love, one stitch at a time</span>
      </div>
    </div>
  </header>

  <nav class="category-nav" id="categoryNav">
    <!-- category buttons are generated automatically from products.js -->
  </nav>

  <main>
    <div class="results-bar">
      <h1 id="categoryHeading">All items</h1>
      <span class="results-count" id="resultsCount"></span>
    </div>

    <section class="grid" id="productGrid">
      <!-- product cards are generated automatically -->
    </section>

    <p class="empty-state" id="emptyState" hidden>Is category mein abhi koi item nahi hai.</p>
  </main>

  <footer class="site-footer">
    <p>Made by Cocochet &middot; prices are for reference, DM to order</p>
  </footer>

  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
