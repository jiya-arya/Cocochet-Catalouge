<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cocochet — Handmade Crochet Catalogue</title>

  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Caveat:wght@600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>


<body>

  <!-- ======================================================
       HEADER
  ======================================================= -->

  <header class="site-header">

    <div class="brand">

      <span class="brand-mark" aria-hidden="true">

        <img src="images/logo.png" alt="" class="brand-logo">

      </span>


      <div class="brand-text">

        <span class="brand-name">
          Cocochet
        </span>


        <span class="brand-tag">
          crafted with love, one stitch at a time
        </span>


        <!-- Instagram + WhatsApp -->

        <div class="brand-contact">

          <a href="https://www.instagram.com/cocochetofficial/" target="_blank" rel="noopener noreferrer">

            <img src="images/instagram.png" alt="" class="contact-icon">

            Instagram ↗

          </a>


          <span>·</span>


          <a href="https://wa.me/916280969844" target="_blank" rel="noopener noreferrer">

            <img src="images/whatsapp.png" alt="" class="contact-icon">

            WhatsApp Orders ↗

          </a>

        </div>

      </div>

    </div>

  </header>


  <!-- ======================================================
       CATEGORY NAVIGATION
  ======================================================= -->

  <nav class="category-nav" id="categoryNav">

    <!-- Categories generated automatically by JavaScript -->

  </nav>


  <!-- ======================================================
       CUSTOMISATION NOTE
  ======================================================= -->

  <p class="customisation-note">
    Customisation Available — DM us for personalised orders
  </p>


  <!-- ======================================================
       MAIN CATALOGUE
  ======================================================= -->

  <main>

    <div class="results-bar">

      <h1 id="categoryHeading">
        All items
      </h1>


      <span class="results-count" id="resultsCount">
      </span>

    </div>


    <!-- ====================================================
         PRODUCT GRID
    ===================================================== -->

    <section class="grid" id="productGrid">

      <!-- Product cards generated automatically -->

    </section>


    <!-- ====================================================
         EMPTY CATEGORY MESSAGE
    ===================================================== -->

    <p class="empty-state" id="emptyState" hidden>

      Is category mein abhi koi item nahi hai.

    </p>

  </main>


  <!-- ======================================================
       YOUR ORDER / CART
  ======================================================= -->

  <section class="order-section" id="orderSection" hidden>

    <!-- Order/cart generated automatically by JavaScript -->

  </section>


  <!-- ======================================================
       FOOTER
  ======================================================= -->

  <footer class="site-footer">

    <p>
      Made by Cocochet &middot;
      prices are for reference, DM to order
    </p>

  </footer>


  <!-- ======================================================
       JAVASCRIPT
  ======================================================= -->

  <script src="products.js"></script>

  <script src="script.js"></script>

</body>

</html>
